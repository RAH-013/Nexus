apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexus
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nexus-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: prisma-migrate
          image: theedu117/nexus-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "prisma:deploy"]
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
      containers:
        - name: backend
          image: theedu117/nexus-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server.mjs"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: los archivos que existen se sirven directo; el resto
    # cae en index.html para que el enrutador del cliente decida
    # (F5 o enlaces directos a /recent, /auth, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

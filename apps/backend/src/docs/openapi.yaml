openapi: 3.0.3

info:
  title: API de comentarios de Nexus
  version: 1.2.0
  description: API para consultar, crear, actualizar y eliminar comentarios de películas.

servers:
  - url: /

tags:
  - name: Comments
    description: Operaciones de comentarios

paths:
  /api/comments/movie/tt0468569:
    get:
      tags:
        - Comments
      summary: Listar comentarios de una película
      operationId: getMovieComments
      responses:
        "200":
          description: Lista de comentarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

    post:
      tags:
        - Comments
      summary: Crear un comentario
      operationId: createMovieComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Comentario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/JsonInvalido"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /api/comments/movie/tt0468569/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador interno del comentario
        schema:
          type: integer

    get:
      tags:
        - Comments
      summary: Consultar un comentario
      operationId: getMovieComment
      responses:
        "200":
          description: Comentario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NoExiste"

    put:
      tags:
        - Comments
      summary: Actualizar un comentario
      operationId: updateMovieComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "200":
          description: Comentario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/JsonInvalido"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoExiste"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

    delete:
      tags:
        - Comments
      summary: Eliminar un comentario
      operationId: deleteMovieComment
      responses:
        "200":
          description: Comentario eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comentario eliminado
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoExiste"

components:
  schemas:
    CommentCreate:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          example: Comentario de prueba para Nexus.

    Comment:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: integer
          example: 1
        text:
          type: string
          example: Comentario de prueba para Nexus.

    Error:
      type: object
      required:
        - error
        - detalles
      properties:
        error:
          type: string
        detalles:
          type: array
          items:
            type: string

  responses:
    JsonInvalido:
      description: El cuerpo no contiene JSON válido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DatosInvalidos:
      description: Los datos no cumplen las reglas de validación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NoExiste:
      description: El comentario no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NoAutorizado:
      description: Se requiere una sesión válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflicto:
      description: El comentario ya existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

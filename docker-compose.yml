services:
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      nexus_network:
        ipv4_address: 10.89.5.10

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      nexus_network:
        ipv4_address: 10.89.5.11

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    expose:
      - "3000"
    environment:
      TZ: America/Mexico_City
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      nexus_network:
        ipv4_address: 10.89.5.12

  redis:
    image: redis:8-alpine
    container_name: nexus-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      nexus_network:
        ipv4_address: 10.89.5.13

  postgres:
    image: postgres:18-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      nexus_network:
        ipv4_address: 10.89.5.14

volumes:
  postgres_data:

networks:
  nexus_network:
    name: nexus_network
    driver: bridge
    # Subred fija e IPs estáticas: nginx resuelve los
    # upstreams (frontend, backend) una sola vez al
    # arrancar; con IPs cambiantes (rebuild de un
    # servicio) se quedaba con la vieja y daba 502
    # hasta reiniciar nginx.
    ipam:
      config:
        - subnet: 10.89.5.0/24
